name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  crap-ratchet-gate:
    name: CRAP ratchet gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Check the ratchet
        run: npm run crap:check

  crap-baseline-diff:
    name: CRAP baseline diff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff reads the base files from HEAD^1, the first parent of the checked-out commit
          # (for a pull request, its merge commit), so the checkout needs two commits.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compare the baseline with the base
        run: npm run crap:diff
